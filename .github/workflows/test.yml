# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # go.mod is the source of truth for the toolchain. It requires go 1.26,
    # which comes from golang.org/x/sync.
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true

    - name: Install dependencies
      run: go mod download

    - name: Vet
      run: go vet ./...

    # the gorm storage tests use go-sqlite3, which needs cgo
    - name: Test
      run: go test -race -v ./...
